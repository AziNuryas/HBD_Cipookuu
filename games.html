<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer" />
  <title>Mini Games - Congrats</title>
  <link rel="stylesheet" href="./src/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Canvas for 3D/Effects -->
  <canvas id="bgCanvas"></canvas>

  <!-- Top Dock Navigation -->
  <header class="os-dock-wrap">
    <nav class="os-dock">
      <a href="app.html" class="dock-btn" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Kembali</span>
      </a>
      <button class="dock-btn active" data-target="games" style="display:flex;align-items:center;gap:6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg>
        <span>Mini Games</span>
      </button>
    </nav>
  </header>

  <main class="views-wrap" style="pointer-events:auto; z-index:10;">
    <div class="view active" style="opacity:1; pointer-events:auto; overflow-y:auto; -webkit-overflow-scrolling:touch;">
      <div class="view-content slim">
        <h2 class="view-title" style="margin-top:20px; margin-bottom: 24px;">Mini Games</h2>
        <div id="gamesContainer"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initCanvas } from './src/canvas.js';
    import { buildGames } from './src/games.js';
    
    initCanvas();
    buildGames();
  </script>
</body>
</html>
